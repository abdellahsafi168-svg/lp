<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders — HOMY Workspace</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-body: #FFFFFF;
            --bg-sidebar: #F9FAFB;
            --bg-hover: #F3F4F6;
            --border: #E5E7EB;
            --text-main: #111827;
            --text-muted: #6B7280;
            --text-light: #9CA3AF;
            --primary: #111827;
            --primary-hover: #374151;

            --tag-pending-bg: #FFFBEB;
            --tag-pending-txt: #D97706;
            --tag-pending-dot: #F59E0B;

            --tag-confirm-bg: #EFF6FF;
            --tag-confirm-txt: #2563EB;
            --tag-confirm-dot: #3B82F6;

            --tag-noconfirm-bg: #FEF2F2;
            --tag-noconfirm-txt: #DC2626;
            --tag-noconfirm-dot: #EF4444;

            --tag-deliver-bg: #ECFDF5;
            --tag-deliver-txt: #059669;
            --tag-deliver-dot: #10B981;
        }

        [data-theme="dark"] {
            --bg-body: #0B0B0A;
            --bg-sidebar: #131311;
            --bg-hover: #1C1C1A;
            --border: #262624;
            --text-main: #FFFFFF;
            /* Pure white for max contrast */
            --text-muted: #D1D5DB;
            /* Lighter grey */
            --text-light: #9CA3AF;
            /* Clearer light grey */
            --primary: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform 0.3s ease;
            z-index: 50;
        }

        .sidebar-header {
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid transparent;
        }

        .brand-avatar {
            width: 32px;
            height: 32px;
            background: var(--text-main);
            color: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }

        .brand-info h2 {
            font-size: 14px;
            font-weight: 600;
        }

        .brand-info span {
            font-size: 12px;
            color: var(--text-muted);
        }

        .nav-section {
            padding: 16px 12px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 6px;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 4px;
            transition: all 0.2s;
            font-weight: 500;
        }

        .nav-item:hover {
            background-color: var(--bg-hover);
            color: var(--text-main);
        }

        .nav-item.active {
            background-color: #EFEFF1;
            color: var(--text-main);
        }

        .nav-item i {
            width: 18px;
            height: 18px;
            opacity: 0.8;
        }

        .nav-group-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-light);
            margin: 24px 0 8px 12px;
            font-weight: 600;
        }

        /* --- MAIN CONTENT --- */
        .main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--bg-body);
        }

        .topbar {
            padding: 24px 32px 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            background: #10B981;
            /* Green like reference */
            color: white;
            border-color: #10B981;
        }

        .page-title h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .page-title p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .topbar-actions {
            display: flex;
            gap: 12px;

        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg-body);
            color: var(--text-main);
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--bg-hover);
        }

        .btn-primary {
            background: #10B981;
            /* Green like reference */
            color: white;
            border-color: #10B981;
        }

        .btn-primary:hover {
            background: #059669;
        }

        .btn i {
            width: 14px;
            height: 14px;
        }

        /* --- TOOLBAR --- */
        .toolbar {
            padding: 0 32px 16px;
            display: flex;
            gap: 12px;
            border-bottom: 1px solid var(--border);
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-body);
            min-width: 280px;
            color: var(--text-muted);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box:focus-within {
            border-color: var(--text-light);
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
        }

        .search-box i {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .search-box input {
            border: none;
            outline: none;
            background: transparent;
            font-size: 13px;
            width: 100%;
            color: var(--text-main);
        }

        .search-box button:hover {
            color: var(--text-main) !important;
        }

        .filter-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            font-size: 13px;
            color: var(--text-muted);
            background: transparent;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--bg-hover);
            color: var(--text-main);
        }

        .filter-btn.active {
            font-weight: 600;
            background: var(--border);
        }

        /* --- TABLE --- */
        .table-container {
            flex-grow: 1;
            overflow: auto;
            padding: 0 32px 32px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: left;
        }

        th {
            position: sticky;
            top: 0;
            background: var(--bg-body);
            padding: 12px 16px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            z-index: 10;
            white-space: nowrap;
        }

        th i {
            width: 12px;
            height: 12px;
            display: inline-block;
            vertical-align: middle;
            margin-left: 4px;
            opacity: 0.5;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--bg-hover);
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        tr {
            transition: background-color 0.15s;
        }

        tr:hover {
            background-color: var(--bg-hover);
        }

        /* Custom cell styles */
        .cell-customer {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-main);
            font-weight: 500;
        }

        .avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--bg-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .cell-email {
            color: #2563EB;
            /* Blue link color */
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 500;
        }

        .tag-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .tag.pending {
            background: var(--tag-pending-bg);
            color: var(--tag-pending-txt);
        }

        .tag.confirm {
            background: var(--tag-confirm-bg);
            color: var(--tag-confirm-txt);
        }

        .tag.no_confirm {
            background: var(--tag-noconfirm-bg);
            color: var(--tag-noconfirm-txt);
        }

        .tag.deliver {
            background: var(--tag-deliver-bg);
            color: var(--tag-deliver-txt);
        }

        .more-btn {
            background: transparent;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
        }

        .more-btn:hover {
            background: var(--border);
            color: var(--text-main);
        }

        /* Checkbox custom */
        .chk-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        input[type="checkbox"] {
            appearance: none;
            width: 14px;
            height: 14px;
            border: 1px solid var(--text-light);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        input[type="checkbox"]:checked {
            background: var(--primary);
            border-color: var(--primary);
        }

        input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 4px;
            top: 1px;
            width: 4px;
            height: 8px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* Mobile Nav Toggle */
        .mobile-toggle {
            display: none;
            background: transparent;
            border: none;
            padding: 8px;
            cursor: pointer;
        }

        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-muted);
            display: none;
        }

        .empty-state i {
            width: 48px;
            height: 48px;
            color: var(--text-light);
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Loader */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px;
            color: var(--text-light);
        }

        .loading-spinner i {
            animation: spin 1s linear infinite;
            width: 24px;
            height: 24px;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .sidebar {
                position: absolute;
                left: -260px;
                height: 100%;
                box-shadow: 4px 0 24px rgba(0, 0, 0, 0.05);
            }

            .sidebar.open {
                left: 0;
            }

            .mobile-toggle {
                display: block;
                margin-right: 16px;
            }

            .topbar {
                padding: 16px 20px;
                align-items: center;
            }

            .toolbar {
                padding: 0 20px 16px;
            }

            .table-container {
                padding: 0 20px 20px;
            }

            .search-box {
                flex-grow: 1;
                min-width: 0;
            }
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="brand-avatar">HM</div>
            <div class="brand-info">
                <h2>HOMY Studio</h2>
                <span>Sales Admin</span>
            </div>
            <i data-lucide="chevrons-up-down" style="margin-left: auto; width: 14px; color: var(--text-muted)"></i>
        </div>

        <div class="nav-section">
            <a href="#" class="nav-item">
                <i data-lucide="layout-dashboard"></i>
                Dashboard
            </a>
            <a href="#" class="nav-item">
                <i data-lucide="inbox"></i>
                Inbox
            </a>
            <a href="#" class="nav-item">
                <i data-lucide="bell"></i>
                Notification
            </a>

            <div class="nav-group-title">WORKSPACE</div>

            <a href="#" class="nav-item active">
                <i data-lucide="users"></i>
                Customers
            </a>
            <a href="#" class="nav-item">
                <i data-lucide="package"></i>
                Inventory
            </a>
            <a href="#" class="nav-item">
                <i data-lucide="bar-chart-2"></i>
                Report
            </a>

            <div class="nav-group-title">SYSTEM</div>
            <div class="nav-item" id="connection-status" style="font-size: 12px; color: var(--text-light);">
                <span id="status-dot"
                    style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#9CA3AF;margin-right:8px;"></span>
                Connecting...
            </div>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
        <!-- TOPBAR -->
        <div class="topbar">
            <div style="display: flex; align-items: center;">
                <button class="mobile-toggle" onclick="toggleSidebar()">
                    <i data-lucide="menu"></i>
                </button>
                <div class="page-title">
                    <h1>Customers</h1>
                    <p><span id="count-val">0</span> Orders total</p>
                </div>
            </div>
            <div class="topbar-actions">
                <button class="btn" onclick="toggleTheme()" title="Toggle Appearance">
                    <i data-lucide="moon"></i>
                </button>
                <button class="btn" onclick="fetchOrders()">
                    <i data-lucide="refresh-cw"></i> Sync
                </button>

            </div>
        </div>
        <!-- TOOLBAR -->
        <div class="toolbar">
            <div class="search-box">
                <i data-lucide="search"></i>
                <input type="text" id="searchInput" placeholder="Search orders, specs, or phone..."
                    oninput="filterTable()">
                <button onclick="clearSearch()" id="clear-btn"
                    style="display:none; background:transparent; border:none; cursor:pointer; color:var(--text-light);">
                    <i data-lucide="x" style="width:14px; height:14px;"></i>
                </button>
            </div>

            <button class="filter-btn" onclick="setFilter('all')">
                <i data-lucide="list"></i> All Orders
            </button>
            <button class="filter-btn" onclick="setFilter('pending')">
                <i data-lucide="clock"></i> Pending
            </button>
            <button class="filter-btn" onclick="setFilter('confirm')">
                <i data-lucide="check"></i> Confirmed
            </button>
            <button class="filter-btn" onclick="setFilter('no_confirm')">
                <i data-lucide="x"></i> No Confirm
            </button>
            <button class="filter-btn" onclick="setFilter('deliver')">
                <i data-lucide="truck"></i> Delivered
            </button>

            <div style="margin-left: auto; display: flex; gap: 8px;">
                <button class="filter-btn" onclick="exportCSV()">
                    <i data-lucide="download"></i> Export CSV
                </button>
            </div>
        </div>

        <!-- TABLE -->
        <div class="table-container">
            <table id="ordersTable">
                <thead>
                    <tr>
                        <th style="width: 40px; text-align: center;">
                            <div class="chk-wrap"><input type="checkbox"></div>
                        </th>
                        <th><i data-lucide="user"></i> Name</th>
                        <th><i data-lucide="phone"></i> Phone</th>
                        <th><i data-lucide="map-pin"></i> State</th>
                        <th><i data-lucide="map"></i> Commune</th>
                        <th><i data-lucide="calendar"></i> Created</th>
                        <th><i data-lucide="package"></i> Specs</th>
                        <th><i data-lucide="info"></i> Status</th>
                        <th><i data-lucide="globe"></i> Lang</th>
                        <th style="width: 40px; text-align: center;"><i data-lucide="phone-call"></i></th>
                        <th style="width: 40px;"></th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Rows injected here -->
                </tbody>
            </table>

            <div id="loader" class="loading-spinner">
                <i data-lucide="loader-2"></i>
            </div>

            <div id="emptyState" class="empty-state">
                <i data-lucide="inbox"></i>
                <h3>No orders found</h3>
                <p>We couldn't find any orders matching your criteria.</p>
            </div>
        </div>
    </main>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Mobile Sidebar Toggle
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // Supabase Init
        const _supabaseUrl = 'https://yfgqtatdqzygkvlvkiqr.supabase.co';
        // Using the Publishable Key (Safe for browser use)
        const _supabaseKey = 'sb_publishable_10DpZ2v7FFGI9g4WqPnIqA_GiCqXjGD';
        let _supabase = null;

        function initSupabase() {
            if (_supabase) return _supabase;
            try {
                if (typeof supabase === 'undefined') return null;
                _supabase = supabase.createClient(_supabaseUrl, _supabaseKey);
                return _supabase;
            } catch (e) {
                console.error("Supabase Init Error:", e);
                return null;
            }
        }

        let allOrders = [];
        let currentFilter = 'all';

        // Helper: Get Initials
        function getInitials(name) {
            if (!name) return '?';
            const parts = name.split(' ');
            if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
            return name.substring(0, 2).toUpperCase();
        }

        // Helper: Format Date (Nov 11, 2023)
        function formatDate(isoString) {
            const date = new Date(isoString);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        async function fetchOrders() {
            const loader = document.getElementById('loader');
            const tbody = document.getElementById('tableBody');
            const emptyState = document.getElementById('emptyState');
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('connection-status');

            tbody.innerHTML = '';
            loader.style.display = 'flex';
            emptyState.style.display = 'none';

            try {
                const sb = initSupabase();
                if (!sb) throw new Error("Supabase script failed to load. Check your internet.");

                const { data, error, status } = await sb
                    .from('orders')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error("Supabase Error:", error);
                    throw error;
                }

                allOrders = data;

                // Respect current search/filter
                filterTable();

                document.getElementById('count-val').textContent = allOrders.length;

                // Update Status Indicator
                statusDot.style.background = '#10B981';
                statusText.innerHTML = '<span id="status-dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#10B981;margin-right:8px;"></span>Connected';

                if (data.length === 0) {
                    emptyState.style.display = 'block';
                }

            } catch (err) {
                console.error("Fetch Error:", err);
                statusDot.style.background = '#EF4444';
                statusText.innerHTML = '<span id="status-dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#EF4444;margin-right:8px;"></span>Connection Error';

                let msg = err.message || "Unknown error";
                if (msg.includes("fetch")) msg = "Network error. Check your internet or Supabase URL.";
                if (msg.includes("401") || msg.includes("403")) msg = "Permission denied. Check RLS policies.";

                alert("Dashboard Error: " + msg);
            } finally {
                loader.style.display = 'none';
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            const emptyState = document.getElementById('emptyState');

            tbody.innerHTML = '';

            if (data.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            data.forEach(order => {
                const initials = getInitials(order.full_name);
                const dateStr = formatDate(order.created_at);

                // Status Logic
                const status = (order.status || 'pending').toLowerCase();

                const specs = `${order.quantity}x ${order.table_size}cm (${order.finish})`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="text-align: center;">
                        <div class="chk-wrap"><input type="checkbox"></div>
                    </td>
                    <td>
                        <div class="cell-customer">
                            <div class="avatar">${initials}</div>
                            <i data-lucide="user" style="width:14px; color:var(--text-light); margin-right:4px;"></i>
                            ${order.full_name}
                        </div>
                    </td>
                    <td class="cell-email" onclick="copyToClipboard('${order.phone_number}', this)" style="cursor:pointer;" title="Click to copy">
                        <i data-lucide="phone" style="width:14px; color:var(--text-light); margin-right:4px;"></i>
                        ${order.phone_number} <i data-lucide="copy" style="width:10px; opacity:0.3;"></i>
                    </td>
                    <td>
                        <i data-lucide="map-pin" style="width:14px; color:var(--text-light); margin-right:4px;"></i>
                        ${order.state_wilaya || '—'}
                    </td>
                    <td>
                        <i data-lucide="map" style="width:14px; color:var(--text-light); margin-right:4px;"></i>
                        ${order.municipality || '—'}
                    </td>
                    <td>
                        <i data-lucide="calendar" style="width:14px; color:var(--text-light); margin-right:4px;"></i>
                        ${order.created_at ? dateStr : '-'}
                    </td>
                    <td>
                        <i data-lucide="package" style="width:14px; color:var(--text-light); margin-right:4px;"></i>
                        ${specs}
                    </td>
                    <td>
                        <select onchange="updateStatus('${order.id}', this.value)" style="border:none; background:transparent; font-weight:600; cursor:pointer;" class="tag ${status}">
                            <option value="pending" ${status === 'pending' ? 'selected' : ''}>Pending</option>
                            <option value="confirm" ${status === 'confirm' ? 'selected' : ''}>Confirm</option>
                            <option value="no_confirm" ${status === 'no_confirm' ? 'selected' : ''}>No Confirm</option>
                            <option value="deliver" ${status === 'deliver' ? 'selected' : ''}>Deliver</option>
                        </select>
                    </td>
                    <td>
                        <i data-lucide="globe" style="width:14px; color:var(--text-light); margin-right:4px;"></i>
                        <span style="text-transform:uppercase; font-size:11px; color:var(--text-light)">${order.language || 'EN'}</span>
                    </td>
                    <td style="text-align: center;">
                        <button onclick="callCustomer('${order.phone_number}')" class="more-btn" style="color: #2563EB;" title="Call Customer">
                            <i data-lucide="phone-call" style="width:16px;height:16px"></i>
                        </button>
                    </td>
                    <td>
                        <button class="more-btn" onclick="deleteOrder('${order.id}')" title="Delete Order">
                            <i data-lucide="trash-2" style="width:16px;height:16px;color:var(--tag-noconfirm-txt)"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // Re-initialize icons for new DOM elements
            lucide.createIcons();
        }

        // Theme Logic
        function toggleTheme() {
            const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('dashboard-theme', theme);
        }

        if (localStorage.getItem('dashboard-theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        // Click to Copy
        function copyToClipboard(text, el) {
            navigator.clipboard.writeText(text);
            const original = el.innerHTML;
            el.innerHTML = '<span style="color:#10B981">Copied!</span>';
            setTimeout(() => el.innerHTML = original, 2000);
        }

        // Filtering Logic
        function setFilter(type) {
            currentFilter = type;

            // Update active button UI
            document.querySelectorAll('.filter-btn').forEach(btn => {
                const btnText = btn.textContent.toLowerCase();
                if (btnText.includes(type) || (type === 'all' && btnText.includes('all'))) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            filterTable();
        }

        // Basic frontend search & Filter
        function clearSearch() {
            const input = document.getElementById('searchInput');
            input.value = '';
            document.getElementById('clear-btn').style.display = 'none';
            filterTable();
        }

        function filterTable() {
            const input = document.getElementById('searchInput');
            const query = input.value.toLowerCase();
            const clearBtn = document.getElementById('clear-btn');

            // Show/Hide clear button
            clearBtn.style.display = query ? 'block' : 'none';

            let filtered = allOrders;

            // Apply Status Filter
            if (currentFilter !== 'all') {
                filtered = filtered.filter(o => (o.status || 'pending').toLowerCase() === currentFilter);
            }

            // Apply Search Filter (Comprehensive)
            if (query) {
                filtered = filtered.filter(o => {
                    const fullName = (o.full_name || '').toLowerCase();
                    const phone = (o.phone_number || '').toLowerCase();
                    const state = (o.state_wilaya || '').toLowerCase();
                    const municipality = (o.municipality || '').toLowerCase();
                    const finish = (o.finish || '').toLowerCase();
                    const size = (o.table_size || '').toString().toLowerCase();
                    const qty = (o.quantity || '').toString().toLowerCase();

                    return fullName.includes(query) ||
                        phone.includes(query) ||
                        state.includes(query) ||
                        municipality.includes(query) ||
                        finish.includes(query) ||
                        size.includes(query) ||
                        qty.includes(query);
                });
            }

            document.getElementById('count-val').textContent = filtered.length;
            renderTable(filtered);
        }

        // Update Status in Database
        async function updateStatus(id, newStatus) {
            const sb = initSupabase();
            if (!sb) return;

            const selectEl = event.target;
            const originalValue = selectEl.value;
            const originalClass = selectEl.className;

            // Visual feedback
            selectEl.style.opacity = "0.5";
            selectEl.className = `tag ${newStatus}`;

            try {
                const { error } = await sb
                    .from('orders')
                    .update({ status: newStatus })
                    .eq('id', id);

                if (error) {
                    console.error("Supabase error detail:", error);
                    throw new Error(error.message || "Database rejected the change");
                }

                // Update local data
                const index = allOrders.findIndex(o => o.id === id);
                if (index !== -1) allOrders[index].status = newStatus;

                console.log(`✅ Status saved: ${newStatus}`);
            } catch (err) {
                console.error("Update Error:", err);

                let friendlyMsg = err.message;
                if (friendlyMsg.includes("column \"status\" does not exist")) {
                    friendlyMsg = "CRITICAL: The 'status' column is missing in your database! Please run the SQL command provided in the chat.";
                } else if (friendlyMsg.includes("policy")) {
                    friendlyMsg = "PERMISSION DENIED: You need to run the UPDATE policy in Supabase SQL Editor.";
                }

                alert("Update Failed: " + friendlyMsg);

                // Revert UI on failure
                selectEl.value = originalValue;
                selectEl.className = originalClass;
                fetchOrders();
            } finally {
                selectEl.style.opacity = "1";
            }
        }

        // Call Logic
        function callCustomer(phoneNumber) {
            if (!phoneNumber) return;
            // Clean the number (remove spaces etc)
            const cleanNumber = phoneNumber.replace(/\s+/g, '');
            window.location.href = `tel:${cleanNumber}`;
        }

        // Delete Order from Database
        async function deleteOrder(id) {
            if (!confirm("Are you sure you want to delete this order?")) return;

            const sb = initSupabase();
            if (!sb) return;

            try {
                const { error } = await sb
                    .from('orders')
                    .delete()
                    .eq('id', id);

                if (error) throw error;
            } catch (err) {
                console.error(err);
                alert("Failed to delete order: " + err.message);
            }
        }

        // Robust CSV Export for Excel
        function exportCSV() {
            if (allOrders.length === 0) {
                alert("No data to export");
                return;
            }

            const headers = ["Date", "Customer Name", "Phone", "State (Wilaya)", "Municipality (Commune)", "Specs", "Status", "Language"];
            
            // Format rows with quoting to handle commas in data
            const rows = allOrders.map(o => {
                const specs = `${o.quantity}x ${o.table_size}cm (${o.finish})`;
                const date = new Date(o.created_at).toLocaleString();
                
                return [
                    `"${date}"`,
                    `"${o.full_name || ''}"`,
                    `"${o.phone_number || ''}"`,
                    `"${o.state_wilaya || ''}"`,
                    `"${o.municipality || ''}"`,
                    `"${specs}"`,
                    `"${(o.status || 'pending').toUpperCase()}"`,
                    `"${(o.language || 'EN').toUpperCase()}"`
                ].join(",");
            });

            // Add UTF-8 BOM for Excel Arabic/Special char support
            const csvContent = "\uFEFF" + headers.join(",") + "\n" + rows.join("\n");
            
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `homy_orders_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // Initial Load
        fetchOrders();

        // ---------------------------------------------------
        // REAL-TIME SUPABASE CONNECTION
        // ---------------------------------------------------
        function setupRealtime() {
            const sb = initSupabase();
            if (!sb) return;

            const ordersChannel = sb.channel('public:orders')
                .on(
                    'postgres_changes',
                    { event: '*', schema: 'public', table: 'orders' },
                    (payload) => {
                        console.log('Real-time update received:', payload);

                        if (payload.eventType === 'INSERT') {
                            allOrders.unshift(payload.new);
                            document.getElementById('count-val').textContent = allOrders.length;

                            const syncBtn = document.querySelector('.topbar-actions .btn:first-child');
                            const originalHtml = syncBtn.innerHTML;
                            syncBtn.innerHTML = '<i data-lucide="bell-ring"></i> New Order!';
                            syncBtn.style.color = '#10B981';
                            syncBtn.style.borderColor = '#10B981';
                            lucide.createIcons();

                            setTimeout(() => {
                                syncBtn.innerHTML = originalHtml;
                                syncBtn.style.color = '';
                                syncBtn.style.borderColor = '';
                                lucide.createIcons();
                            }, 4000);

                        } else if (payload.eventType === 'UPDATE') {
                            const index = allOrders.findIndex(o => o.id === payload.new.id);
                            if (index !== -1) {
                                allOrders[index] = payload.new;
                            }
                        } else if (payload.eventType === 'DELETE') {
                            allOrders = allOrders.filter(o => o.id !== payload.old.id);
                            document.getElementById('count-val').textContent = allOrders.length;
                        }

                        filterTable();
                    }
                )
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        console.log('✅ Successfully connected to Supabase Realtime');
                    }
                });
        }

        // Initial Load & Realtime Setup
        setTimeout(() => {
            fetchOrders();
            setupRealtime();
        }, 500); // Give CDN a moment to settle
    </script>
</body>

</html>
